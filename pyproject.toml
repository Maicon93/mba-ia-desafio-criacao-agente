[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK + FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk==2.10.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "aurora.main:main"
restaurar = "aurora.restaurar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]
